# Reading Files
include:
  - .htaccess
  - _pages
  # - /docs
  - _posts
  - _portfolio
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /test # ignore Minimal Mistakes /test
  - /docs # ignore Minimal Mistakes /docs
  
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  portfolio:
    output: true
    permalink: /:collection/:path/
    
# Galleries
home_work_gallery:
  - url: assets/images/illustrations/lowvision.png
    image_path: assets/images/illustrations/lowvision.png
    alt: "low vision research"
    title: "Low Vision Assistive Tools"
  - url: assets/images/illustrations/cogdev.jpg
    image_path: assets/images/illustrations/cogdev.jpg
    alt: "VLM Theory-of-Mind"
    title: "VLM Theory-of-Mind"
  - url: assets/images/illustrations/ar.png
    image_path: assets/images/illustrations/ar.png
    alt: "Medical AR"
    title: "Medical AR"
news_gallery:
  - url: /assets/images/unsplash-gallery-image-1.jpg
    image_path: /assets/images/unsplash-gallery-image-1-th.jpg
    alt: "placeholder image 1"
    title: "Image 1 title caption"

